$kind: http-request
url: http://127.0.0.1:5000/programs/{{programId}}/roles
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "userId": "{{staffId}}",
      "roleType": "STAFF"
    }
scripts:
  - type: afterResponse
    code: pm.test('Staff role added', () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
