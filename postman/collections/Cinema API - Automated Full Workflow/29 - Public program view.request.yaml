$kind: http-request
url: http://127.0.0.1:5000/programs/{{programId}}
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Announced program is public', () => pm.response.to.have.status(200));
      pm.expect(pm.response.json().state).to.eql('ANNOUNCED');
      pm.expect(pm.response.json()).not.to.have.property('staff');
    language: text/javascript
order: 29000
