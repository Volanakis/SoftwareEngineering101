$kind: http-request
url: http://127.0.0.1:5000/programs/{{programId}}/screenings/{{screeningId}}/submit
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test('Screening submitted', () => pm.response.to.have.status(200));
      pm.expect(pm.response.json().state).to.eql('SUBMITTED');
    language: text/javascript
order: 11000
